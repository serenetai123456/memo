<!doctype html><html lang="en"><head><title>Sign in</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/shared/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="/shared/app.js"></script></head><body><main style="max-width:420px">
<div class="card" style="margin-top:2rem"><h2>Sign in</h2><p class="mut">Use the account your manager created for you.</p>
<form id="f"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required>
<label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
<div class="row"><button class="btn" id="go">Sign in</button></div><div id="msg"></div></form></div></main>
<script>
(async()=>{ if(!await App.init('login')) return;
$('#f').onsubmit=async e=>{ e.preventDefault(); const b=$('#go'); b.disabled=true;
  const {error}=await App.db.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#pw').value});
  if(error){ b.disabled=false; return App.msg('#msg','Sign in failed: '+error.message+'. Check your email and password.','err'); }
  location.href='/home/'; };
})();
</script></body></html>
